[package]
name = "leash-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared blocklist for AI agent payments: evidence-carrying reports, curator confirmation"
repository = "https://github.com/hycorange/near-leash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
